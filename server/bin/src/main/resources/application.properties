server.port=8080
spring.application.name=face-profile-discovery-server

# H2 Database in-memory store for instant zero-dependency execution
spring.datasource.url=jdbc:h2:mem:facedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security & Secrets
jwt.secret=9a2f8c4e7b1a6d3e8f0c2b5a4e9d1c7f3b8a0e6d4c2b9a7f5e1d3c8b0a4f6e2d
jwt.expiration.ms=86400000

# Internal AI Processing Service URL
ai.service.url=http://127.0.0.1:8000
